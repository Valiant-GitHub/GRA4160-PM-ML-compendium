<!-- GRA 4160 — color-code left-sidebar method links by method family.
     Runs once at load; for each sidebar link whose filename matches a method
     page, adds the matching .fam-* class (which sets --page-family in custom.scss).
     The SCSS sidebar rules read --page-family for the accent. Additive only;
     non-method links (index, cross_method, drill, big_picture, appendix) are
     left untouched, so a colored entry semantically means "method page". -->
<script>
(function () {
  "use strict";
  var familyMap = {
    "ols.html": "fam-linear",
    "knn.html": "fam-linear",
    "logistic.html": "fam-linear",
    "lda.html": "fam-linear",
    "adaline.html": "fam-linear",
    "regularization.html": "fam-linear",
    "decision_trees.html": "fam-tree",
    "random_forests.html": "fam-tree",
    "ensembles.html": "fam-tree",
    "pca.html": "fam-unsup",
    "kmeans.html": "fam-unsup",
    "nn_basics.html": "fam-neural",
    "autodiff.html": "fam-neural",
    "nn_pytorch.html": "fam-neural",
    "build_a_nn.html": "fam-neural",
    "bias_variance.html": "fam-cross",
    "cv_info_criteria.html": "fam-cross"
  };
  function colorize() {
    var sidebar = document.getElementById("quarto-sidebar");
    if (!sidebar) return;
    var links = sidebar.querySelectorAll("a[href]");
    links.forEach(function (link) {
      var href = link.getAttribute("href") || "";
      var filename = href.split("/").pop().split("?")[0].split("#")[0];
      var fam = familyMap[filename];
      if (fam) link.classList.add(fam);
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", colorize);
  } else {
    colorize();
  }
})();
</script>
